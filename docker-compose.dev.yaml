# Development docker-compose for running PostgreSQL and Redis
# Used with PM2 for local development

services:
  teable-db:
    image: postgres:15.4
    restart: always
    ports:
      - '54321:5432'
    volumes:
      - teable-db:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_DB=teable
      - POSTGRES_USER=teable
      - POSTGRES_PASSWORD=teable
    healthcheck:
      test: ['CMD-SHELL', "sh -c 'pg_isready -U teable -d teable'"]
      interval: 10s
      timeout: 3s
      retries: 3

  teable-cache:
    image: redis:7.2.4
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - teable-cache:/data:rw
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  teable-db: {}
  teable-cache: {}
